min_version = "2026.11.11"

[tasks.setup]
description = "Restore App Store apps and verify the installed CUE executable"
depends = ["app-store:apply"]
tools."aqua:cue-lang/cue" = "0.17.1"
run = "cue version"

[tasks."app-store:apply"]
description = "Install missing apps from the Mac App Store"
tools.mas = "7.0.0"
run = [
  "mas version",
  '{{ mise_bin | quote }} bootstrap packages apply --manager mas',
]

[tasks."app-store:upgrade"]
description = "Upgrade all installed Mac App Store apps"
tools.mas = "7.0.0"
run = "mas upgrade"

[bootstrap.packages]
"mas:1631624924" = "latest" # Final Cut Pro
