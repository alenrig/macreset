[tasks.packages]
description = "Restore Homebrew formulae and desktop apps"
interactive = true
# Tap definitions require Ruby 3+. Keep it scoped to package setup.
tools.ruby = "3.4"
env.MACRESET_MISE = "{{ mise_bin }}"
env.MACRESET_BREW_PREFIX = "{{ system_brew_prefix }}"
run = '''
set -eu
if [ "$(uname -s)" != Darwin ] || [ "$(uname -m)" != arm64 ] || [ "$(id -u)" = 0 ]; then
  echo "Run package setup as your login user in a native Apple Silicon macOS terminal." >&2
  exit 1
fi
# mise checks Docker Desktop ownership under the canonical token only.
if [ -e "$MACRESET_BREW_PREFIX/Caskroom/docker" ] || [ -L "$MACRESET_BREW_PREFIX/Caskroom/docker" ]; then
  echo "Found a legacy Docker cask record. Check it with Homebrew and migrate it to docker-desktop before retrying. See docs/mise-packages.md." >&2
  exit 1
fi
"$MACRESET_MISE" bootstrap packages apply --manager brew
"$MACRESET_MISE" bootstrap packages apply --manager brew-cask
cue_prefix=$("$MACRESET_MISE" bootstrap packages where brew:cue)
"$cue_prefix/bin/cue" version
'''

[tasks.setup]
description = "Restore workstation packages, App Store apps, and the terminal environment"
depends = ["packages"]
run = [
  "{{ mise_bin | quote }} run app-store:apply",
  "{{ mise_bin | quote }} run terminal:restore",
]

[tasks."app-store:apply"]
description = "Install missing apps from the Mac App Store"
tools.mas = "7.0.0"
run = [
  "mas version",
  '{{ mise_bin | quote }} bootstrap packages apply --manager mas',
]

[tasks."app-store:upgrade"]
description = "Upgrade all installed Mac App Store apps"
tools.mas = "7.0.0"
run = "mas upgrade"

