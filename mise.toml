[dotfiles]
"~/.zshenv/macreset-path" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }

# Activate outside the five private linked files; never edit their checkout.
"~/.zshenv/macreset-mise" = { line = 'if [[ -o interactive ]] && command -v mise >/dev/null; then eval "$(mise activate zsh)"; fi' }
"~/.gitconfig" = { source = "~/Developer/dotfiles/.gitconfig", mode = "symlink" }
"~/.gitignore" = { source = "~/Developer/dotfiles/.gitignore", mode = "symlink" }
"~/.vimrc" = { source = "~/Developer/dotfiles/.vimrc", mode = "symlink" }
"~/.zshrc" = { source = "~/Developer/dotfiles/.zshrc", mode = "symlink" }
"~/.zprofile" = { source = "~/Developer/dotfiles/.zprofile", mode = "symlink" }
"~/.oh-my-zsh/custom/themes/example.zsh" = { mode = "absent" }
"~/.oh-my-zsh/custom/themes/example.zsh-theme" = { mode = "absent" }
"~/.config/ghostty/config" = { source = "assets/ghostty", mode = "copy", permissions = "0644" }
"~/bin/macreset" = { source = "assets/bin/macreset", mode = "copy", permissions = "0755" }
"~/bin/macupdate" = { source = "assets/bin/macupdate", mode = "copy", permissions = "0755" }

[bootstrap.repos]
"~/Developer/dotfiles" = { url = "ssh://git@github.com/alenrig/dotfiles.git", ref = "main" }
"~/.vim/bundle/Vundle.vim" = { url = "https://github.com/VundleVim/Vundle.vim.git", ref = "master" }
"~/.vim/bundle/auto-pairs" = { url = "https://github.com/jiangmiao/auto-pairs.git", ref = "master" }
"~/.vim/bundle/nerdtree" = { url = "https://github.com/scrooloose/nerdtree.git", ref = "master" }
"~/.vim/bundle/vim" = { url = "https://github.com/dracula/vim.git", ref = "master" }
"~/.vim/bundle/vim-airline" = { url = "https://github.com/bling/vim-airline.git", ref = "master" }
"~/.vim/bundle/vim-airline-themes" = { url = "https://github.com/vim-airline/vim-airline-themes.git", ref = "master" }
"~/.vim/bundle/vim-commentary" = { url = "https://github.com/tpope/vim-commentary.git", ref = "master" }
"~/.vim/bundle/vim-fugitive" = { url = "https://github.com/tpope/vim-fugitive.git", ref = "master" }
"~/.vim/bundle/vim-indentwise" = { url = "https://github.com/jeetsukumaran/vim-indentwise.git", ref = "master" }
"~/.vim/bundle/vim-plugin-ruscmd" = { url = "https://github.com/powerman/vim-plugin-ruscmd.git", ref = "master" }
"~/.vim/bundle/vim-repeat" = { url = "https://github.com/tpope/vim-repeat.git", ref = "master" }
"~/.vim/bundle/vim-surround" = { url = "https://github.com/tpope/vim-surround.git", ref = "master" }
"~/.oh-my-zsh/custom/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions", ref = "master" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "master" }
"~/.oh-my-zsh/custom/themes" = { url = "https://github.com/dracula/zsh.git", ref = "master" }
"~/.config/ghostty/themes/drcl" = { url = "https://github.com/dracula/ghostty.git", ref = "main" }

[tasks.terminal]
description = "Prepare Oh My Zsh before native repository and dotfile application"
depends = ["packages"]
run = "bash scripts/terminal.sh"

[tasks.prerequisites]
description = "Ensure CLT and Homebrew are usable"
run = "bash scripts/prerequisites.sh"

[tasks.tools]
description = "Install mise-managed development runtimes"
depends = ["prerequisites"]
run = ["mise install", "mise upgrade node --yes", "mise use --global node@lts"]

[tasks.packages]
description = "Apply native formula declarations with explicit Homebrew fallbacks"
depends = ["tools"]
run = "bash -euo pipefail -c 'source scripts/brew-env.sh; exec mise exec -- node scripts/packages.mjs'"

[tasks.native]
description = "Apply remaining native machine resources after prerequisites and formulae"
depends = ["terminal"]
run = "mise bootstrap --skip packages,tools,task"

[tasks.setup]
description = "Set up migrated machine resources"
depends = ["dock", "skills", "plugins", "local-llm"]
run = "echo 'Mac setup finished.'"

[vars]
# JSON source/name mapping preserves the skills CLI global inventory and lock format.
agent_skills = '{"fluxcd/agent-skills":["gitops-knowledge","gitops-repo-audit","gitops-cluster-debug"],"mattpocock/skills":["ask-matt","code-review","codebase-design","diagnosing-bugs","domain-modeling","grill-with-docs","implement-spec","implement","improve-codebase-architecture","prototype","research","retro","setup-matt-pocock-skills","tdd","to-spec","to-tickets","triage","wayfinder","grill-me","grilling","handoff","teach","to-questionnaire","wait-what","writing-for-agents"]}'
local_llm_model = "qwen3-coder:30b"
local_llm_context_length = "65536"
pi_default_provider = "openai"
pi_default_model = "gpt-6.1-terra"
pi_default_thinking_level = "medium"
# JSON array keeps package overrides unambiguous across the environment boundary.
pi_packages = '["git:github.com/DietrichGebert/ponytail"]'

