"mas:1615087040" = "latest" # Logic Pro
"mas:497799835" = "latest" # Xcode
"mas:430255202" = "latest" # Mactracker
"mas:1153157709" = "latest" # Speedtest
"mas:425264550" = "latest" # Disk Speed Test
"mas:1451685025" = "latest" # WireGuard
"mas:747648890" = "latest" # Telegram
"mas:1278508951" = "latest" # Trello
"mas:963034692" = "latest" # Streaks
"mas:1474335294" = "latest" # GoodLinks
