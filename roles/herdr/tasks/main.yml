---
- name: Inventory installed Herdr plugins
  ansible.builtin.command:
    argv: [herdr, plugin, list, --json]
  register: herdr_plugin_inventory
  changed_when: false

- name: Install missing managed Herdr plugins
  ansible.builtin.include_tasks: plugin.yml
  loop: "{{ herdr_plugins }}"
  loop_control:
    loop_var: herdr_plugin

- name: Create Herdr configuration directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/herdr"
    state: directory
    mode: '0755'

- name: Restore Herdr settings and keybindings
  ansible.builtin.copy:
    src: config.toml
    dest: "{{ ansible_env.HOME }}/.config/herdr/config.toml"
    mode: '0644'

- name: Create file viewer configuration directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/herdr-file-viewer"
    state: directory
    mode: '0755'

- name: Restore file viewer settings
  ansible.builtin.copy:
    src: file-viewer-config.toml
    dest: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/herdr-file-viewer/config.toml"
    mode: '0644'

- name: Create sbx plugin configuration directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox"
    state: directory
    mode: '0755'

- name: Check for saved Herdr sbx rollback configuration
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.codex-rollback.json"
  register: herdr_sbx_rollback_config

- name: Check current Herdr sbx configuration before the default switch
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.json"
  register: herdr_sbx_current_config
  when: not herdr_sbx_rollback_config.stat.exists

- name: Read current Herdr sbx configuration for rollback
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.json"
  register: herdr_sbx_current_config_contents
  when:
    - not herdr_sbx_rollback_config.stat.exists
    - herdr_sbx_current_config.stat.exists

- name: Ensure the saved rollback configuration will select Codex
  ansible.builtin.assert:
    that:
      - (herdr_sbx_current_config_contents.content | b64decode | from_json).agentKind == 'codex'
    fail_msg: >-
      Herdr sbx config.json does not select Codex and no Codex rollback copy exists.
      Save a known-good Codex configuration as config.codex-rollback.json before
      running the playbook again.
  when:
    - not herdr_sbx_rollback_config.stat.exists
    - herdr_sbx_current_config.stat.exists

- name: Save current Herdr sbx configuration for Codex rollback
  ansible.builtin.copy:
    src: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.json"
    dest: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.codex-rollback.json"
    remote_src: true
    force: false
    mode: '0644'
  when:
    - not herdr_sbx_rollback_config.stat.exists
    - herdr_sbx_current_config.stat.exists

- name: Save prior managed Codex default for first-time Herdr setup
  ansible.builtin.copy:
    src: sbx-config.json
    dest: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.codex-rollback.json"
    force: false
    mode: '0644'
  when:
    - not herdr_sbx_rollback_config.stat.exists
    - not herdr_sbx_current_config.stat.exists

- name: Configure custom Pi adapter as the default for new sandboxes
  ansible.builtin.template:
    src: sbx-config.json.j2
    dest: "{{ ansible_env.HOME }}/.config/herdr/plugins/config/sbx.sandbox/config.json"
    mode: '0644'
