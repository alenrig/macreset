---
- name: Validate local model selection
  ansible.builtin.assert:
    that:
      - local_llm_model is string
      - local_llm_model | length > 0
      - local_llm_expected_digest is match('^[0-9a-f]{64}$')
      - local_llm_context_length | int > 0
      - local_llm_model != 'qwen3.5:4b-q4_K_M' or local_llm_expected_digest != '56671c2ab9385f9cfcb404638e32cd62d88e3501d44822208363c010179a3c90'
    fail_msg: >-
      Local LLM configuration needs a model tag, its full 64-character
      expected manifest digest, and a positive context length. Set these
      together in config.yml, then rerun the playbook.

- name: Validate maintenance switches
  ansible.builtin.assert:
    that:
      - local_llm_upgrade | string | lower in ['true', 'false']
      - local_llm_refresh_model | string | lower in ['true', 'false']
    fail_msg: >-
      local_llm_upgrade and local_llm_refresh_model must be explicit booleans.
      Pass either as a per-run --extra-vars value, then rerun.

- name: Find Homebrew prefix
  # The Homebrew module manages formula state but does not return the prefix.
  ansible.builtin.command:
    argv: [brew, --prefix]
  register: local_llm_brew_prefix
  changed_when: false

- name: Check Ollama formula installation
  # The Homebrew module does not expose the installed version for comparison.
  ansible.builtin.command:
    argv: [brew, list, --versions, ollama]
  register: local_llm_ollama_formula
  changed_when: false
  failed_when: false

- name: Install or explicitly upgrade Ollama through Homebrew
  when: local_llm_ollama_formula.rc != 0 or local_llm_upgrade | bool
  block:
    - name: Manage Ollama formula
      community.general.homebrew:
        name: ollama
        state: "{{ 'latest' if local_llm_upgrade | bool else 'present' }}"
        update_homebrew: false
      register: local_llm_ollama_package
  rescue:
    - name: Explain Ollama package failure
      ansible.builtin.fail:
        msg: >-
          Ollama Homebrew install or upgrade failed: {{ ansible_failed_result.msg }}.
          Repair Homebrew and rerun, keeping -e local_llm_upgrade=true
          if this was an upgrade.

- name: Read installed Ollama formula after maintenance
  ansible.builtin.command:
    argv: [brew, list, --versions, ollama]
  register: local_llm_ollama_formula_after
  changed_when: false
  failed_when: false

- name: Verify Ollama formula is available
  ansible.builtin.assert:
    that: local_llm_ollama_formula_after.rc == 0
    fail_msg: >-
      Ollama formula is absent after installation or upgrade:
      {{ local_llm_ollama_formula_after.stderr }}. Repair Homebrew and rerun.

- name: Remember whether Ollama binary changed
  ansible.builtin.set_fact:
    local_llm_ollama_binary_changed: >-
      {{ local_llm_ollama_formula.rc != 0 or
         local_llm_ollama_formula.stdout != local_llm_ollama_formula_after.stdout }}

- name: Create user LaunchAgents directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/Library/LaunchAgents"
    state: directory
    mode: '0755'

- name: Manage loopback-only Ollama LaunchAgent
  ansible.builtin.template:
    src: ollama.plist.j2
    dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.macreset.ollama.plist"
    mode: '0644'
  register: local_llm_ollama_settings

- name: Check Ollama LaunchAgent state
  # launchctl has no Ansible module; inspect before changing service state.
  ansible.builtin.command:
    argv: [launchctl, print, "gui/{{ ansible_user_uid }}/com.macreset.ollama"]
  register: local_llm_ollama_launchagent
  changed_when: false
  failed_when: false

- name: Reload Ollama after managed settings change
  ansible.builtin.command:
    argv: [launchctl, bootout, "gui/{{ ansible_user_uid }}/com.macreset.ollama"]
  register: local_llm_ollama_bootout
  changed_when: true
  when:
    - local_llm_ollama_settings.changed or local_llm_ollama_binary_changed
    - local_llm_ollama_launchagent.rc == 0

- name: Start Ollama now and at login
  when: >-
    local_llm_ollama_settings.changed or local_llm_ollama_binary_changed or
    local_llm_ollama_launchagent.rc != 0
  block:
    - name: Bootstrap Ollama LaunchAgent
      ansible.builtin.command:
        argv:
          - launchctl
          - bootstrap
          - "gui/{{ ansible_user_uid }}"
          - "{{ ansible_env.HOME }}/Library/LaunchAgents/com.macreset.ollama.plist"
      register: local_llm_ollama_start
      changed_when: true
  rescue:
    - name: Explain Ollama service failure
      ansible.builtin.fail:
        msg: >-
          Ollama user service failed to start: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}.
          Inspect ~/Library/Logs/macreset-ollama.log and rerun the playbook.

- name: Kickstart loaded but stopped Ollama service
  when:
    - local_llm_ollama_launchagent.rc == 0
    - not local_llm_ollama_settings.changed
    - not local_llm_ollama_binary_changed
    - "'state = running' not in local_llm_ollama_launchagent.stdout"
  block:
    - name: Start stopped Ollama LaunchAgent
      ansible.builtin.command:
        argv: [launchctl, kickstart, "gui/{{ ansible_user_uid }}/com.macreset.ollama"]
      register: local_llm_ollama_kickstart
      changed_when: true
  rescue:
    - name: Explain stopped Ollama service failure
      ansible.builtin.fail:
        msg: >-
          Ollama LaunchAgent was loaded but stopped; kickstart failed:
          {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}.
          Inspect ~/Library/Logs/macreset-ollama.log and rerun the playbook.

- name: Verify loopback Ollama API is available
  block:
    - name: Wait for Ollama model API
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/tags
        return_content: true
        timeout: 5
      register: local_llm_model_list
      until: local_llm_model_list.status == 200
      retries: 12
      delay: 2
  rescue:
    - name: Explain Ollama API failure
      ansible.builtin.fail:
        msg: >-
          Ollama did not answer on 127.0.0.1:11434: {{ ansible_failed_result.msg | default('API unavailable') }}.
          Inspect ~/Library/Logs/macreset-ollama.log, repair the service,
          and rerun the playbook.

- name: Verify managed Ollama service owns loopback listener
  block:
    - name: Read managed Ollama LaunchAgent process
      ansible.builtin.command:
        argv: [launchctl, print, "gui/{{ ansible_user_uid }}/com.macreset.ollama"]
      register: local_llm_ollama_running
      changed_when: false
      until: "'state = running' in local_llm_ollama_running.stdout"
      retries: 5
      delay: 2

    - name: Read Ollama port listeners
      # No Ansible module reports the owning PID and bind address together.
      ansible.builtin.command:
        argv: [lsof, -nP, -iTCP:11434, -sTCP:LISTEN]
      register: local_llm_ollama_listeners
      changed_when: false

    - name: Identify managed process and listeners
      ansible.builtin.set_fact:
        local_llm_managed_pid: >-
          {{ local_llm_ollama_running.stdout | regex_findall('(?m)^\s*pid = (\d+)') | first | default('') }}
        local_llm_listener_rows: "{{ local_llm_ollama_listeners.stdout_lines[1:] }}"

    - name: Assert only managed process listens on loopback
      ansible.builtin.assert:
        that:
          - local_llm_managed_pid | length > 0
          - local_llm_listener_rows | length > 0
          - local_llm_listener_rows | select('search', 'TCP 127\.0\.0\.1:11434 \(LISTEN\)') | list | length == local_llm_listener_rows | length
          - local_llm_listener_rows | select('match', '^\S+\s+' ~ local_llm_managed_pid ~ '\s+') | list | length == local_llm_listener_rows | length
        fail_msg: >-
          Ollama API answered, but the managed LaunchAgent is not the only
          listener bound to 127.0.0.1:11434. LaunchAgent PID {{ local_llm_managed_pid }};
          listeners: {{ local_llm_listener_rows }}.
          Stop competing Ollama services, then rerun the playbook. Do not expose
          port 11434 on a LAN interface.
  rescue:
    - name: Explain Ollama listener verification failure
      ansible.builtin.fail:
        msg: >-
          Could not verify the managed Ollama loopback listener:
          {{ ansible_failed_result.msg | default('listener unavailable') }}.
          Inspect launchctl and lsof, stop competing services, then rerun.

- name: Find selected local model
  ansible.builtin.set_fact:
    local_llm_selected_models: >-
      {{ local_llm_model_list.json.models | default([])
         | selectattr('name', 'equalto', local_llm_model) | list }}

- name: Pull missing or explicitly refreshed selected model
  when: local_llm_selected_models | length == 0 or local_llm_refresh_model | bool
  block:
    - name: Download selected model
      # Ollama model pulls have no Ansible module; the tag was checked above.
      ansible.builtin.command:
        argv: ["{{ local_llm_brew_prefix.stdout }}/bin/ollama", pull, "{{ local_llm_model }}"]
      environment:
        OLLAMA_HOST: 127.0.0.1:11434
      register: local_llm_model_pull
      changed_when: true
  rescue:
    - name: Explain model pull failure
      ansible.builtin.fail:
        msg: >-
          Ollama pull failed for {{ local_llm_model }}: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}.
          Check network access and free disk space, then rerun the playbook.
          An interrupted or partial pull is retried on the next run. A failed
          refresh can leave the selected tag unavailable; rerun with
          -e local_llm_refresh_model=true after repair.

- name: Read local models after any pull
  ansible.builtin.uri:
    url: http://127.0.0.1:11434/api/tags
    return_content: true
  register: local_llm_verified_models

- name: Identify observed manifest digest
  ansible.builtin.set_fact:
    local_llm_observed_models: >-
      {{ local_llm_verified_models.json.models | default([])
         | selectattr('name', 'equalto', local_llm_model) | list }}

- name: Verify selected model and pinned digest
  ansible.builtin.assert:
    that:
      - local_llm_observed_models | length == 1
      - local_llm_observed_models[0].digest | default('missing') == local_llm_expected_digest
    fail_msg: >-
      Ollama model {{ local_llm_model }} digest mismatch or missing tag.
      Expected {{ local_llm_expected_digest }}, observed
      {{ local_llm_observed_models[0].digest if local_llm_observed_models | length else 'missing' }}.
      Check the selected tag and pinned digest in config.yml. To accept a
      different upstream manifest, verify it independently and explicitly
      update local_llm_expected_digest before rerunning.

- name: Check supported Pi installation paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ ansible_env.HOME }}/.pi/agent/bin/pi"
    - "{{ ansible_env.HOME }}/.local/bin/pi"
    - "{{ local_llm_brew_prefix.stdout }}/bin/pi"
  register: local_llm_pi_paths

- name: Select existing Pi executable
  ansible.builtin.set_fact:
    local_llm_pi_executable: >-
      {{ (local_llm_pi_paths.results | selectattr('stat.exists') | map(attribute='item') | list | first)
         | default(ansible_env.HOME ~ '/.local/bin/pi', true) }}

- name: Install missing host Pi
  when: local_llm_pi_paths.results | selectattr('stat.exists') | list | length == 0
  block:
    - name: Install Pi using its supported npm package
      community.general.npm:
        name: "@earendil-works/pi-coding-agent"
        global: true
        state: present
        executable: "{{ local_llm_brew_prefix.stdout }}/bin/npm"
        ignore_scripts: true
      environment:
        NPM_CONFIG_PREFIX: "{{ ansible_env.HOME }}/.local"
        PATH: "{{ local_llm_brew_prefix.stdout }}/bin:{{ ansible_env.PATH }}"
      register: local_llm_pi_install
  rescue:
    - name: Explain Pi installation failure
      ansible.builtin.fail:
        msg: >-
          Host Pi installation failed: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}.
          Confirm Node.js 22.19 or newer and network access, then rerun the playbook.

- name: Upgrade installed host Pi when requested
  when:
    - local_llm_upgrade | bool
    - local_llm_pi_paths.results | selectattr('stat.exists') | list | length > 0
  block:
    - name: Read Pi version before requested update
      ansible.builtin.command:
        argv: ["{{ local_llm_pi_executable }}", --version]
      register: local_llm_pi_version_before
      changed_when: false
    - name: Ask Pi to update itself
      # Pi has no Ansible module; its CLI reports "already up to date" on a no-op.
      ansible.builtin.command:
        argv: ["{{ local_llm_pi_executable }}", update]
      register: local_llm_pi_upgrade_result
      changed_when: "'already up to date' not in (local_llm_pi_upgrade_result.stdout | lower)"
    - name: Read Pi version after requested update
      ansible.builtin.command:
        argv: ["{{ local_llm_pi_executable }}", --version]
      register: local_llm_pi_version_after
      changed_when: false
    - name: Record whether Pi version changed
      ansible.builtin.set_fact:
        local_llm_pi_updated: "{{ local_llm_pi_version_before.stdout != local_llm_pi_version_after.stdout }}"
  rescue:
    - name: Explain Pi upgrade failure
      ansible.builtin.fail:
        msg: >-
          Host Pi update failed: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}.
          Repair Pi or network access and rerun with -e local_llm_upgrade=true.

- name: Locate installed Pi
  ansible.builtin.stat:
    path: "{{ local_llm_pi_executable }}"
  register: local_llm_pi_path

- name: Verify Pi installer exposed its executable
  ansible.builtin.assert:
    that: local_llm_pi_path.stat.exists
    fail_msg: >-
      Host Pi is still unavailable after installation. Inspect the installer
      output and PATH, then rerun the playbook.

- name: Merge host Pi Ollama provider and default model
  block:
    - name: Preserve existing Pi settings while adding Ollama
      merge_pi:
        agent_dir: "{{ ansible_env.HOME }}/.pi/agent"
        model_id: "{{ local_llm_model }}"
        context_length: "{{ local_llm_context_length }}"
        base_url: http://127.0.0.1:11434/v1
      register: local_llm_pi_config
  rescue:
    - name: Explain Pi configuration failure
      ansible.builtin.fail:
        msg: >-
          Host Pi configuration failed: {{ ansible_failed_result.stderr | default(ansible_failed_result.msg) }}.
          Repair invalid JSON in ~/.pi/agent/models.json or settings.json,
          then rerun the playbook. Other Pi providers and preferences were
          not intentionally removed.

- name: Check a pulled or upgraded model path can answer
  when: >-
    (local_llm_model_pull is defined and local_llm_model_pull.changed) or
    local_llm_upgrade | bool
  block:
    - name: Generate a small local response
      ansible.builtin.uri:
        url: http://127.0.0.1:11434/api/generate
        method: POST
        body_format: json
        body:
          model: "{{ local_llm_model }}"
          prompt: "Reply with one word: ready"
          stream: false
          options:
            num_predict: 8
        return_content: true
        timeout: 180
      register: local_llm_inference
    - name: Verify inference produced text
      ansible.builtin.assert:
        that: local_llm_inference.json.response | default('') | trim | length > 0
  rescue:
    - name: Explain model inference failure
      ansible.builtin.fail:
        msg: >-
          Ollama inference failed for {{ local_llm_model }} after pull or upgrade:
          {{ ansible_failed_result.msg | default('empty model response') }}.
          Check Ollama logs, available memory, and the selected model, then
          rerun the playbook with the same maintenance flag if one was used.

- name: Read installed Pi version
  ansible.builtin.command:
    argv: ["{{ local_llm_pi_executable }}", --version]
  register: local_llm_pi_version
  changed_when: false

- name: Read installed Ollama version
  ansible.builtin.command:
    argv: ["{{ local_llm_brew_prefix.stdout }}/bin/ollama", --version]
  register: local_llm_ollama_version
  changed_when: false

- name: Report host local LLM state
  ansible.builtin.debug:
    msg:
      pi_version: "{{ local_llm_pi_version.stdout }}"
      ollama_version: "{{ local_llm_ollama_version.stdout }}"
      model: "{{ local_llm_model }}"
      observed_digest: "{{ local_llm_observed_models[0].digest }}"
      ollama_installed: "{{ local_llm_ollama_formula.rc != 0 and local_llm_ollama_package is defined and local_llm_ollama_package.changed }}"
      ollama_version_changed: "{{ local_llm_ollama_formula.rc == 0 and local_llm_ollama_binary_changed }}"
      ollama_restarted: "{{ local_llm_ollama_bootout is defined and local_llm_ollama_bootout.changed }}"
      ollama_started: >-
        {{ (local_llm_ollama_start is defined and local_llm_ollama_start.changed) or
           (local_llm_ollama_kickstart is defined and local_llm_ollama_kickstart.changed) }}
      ollama_settings_changed: "{{ local_llm_ollama_settings.changed }}"
      model_pulled: "{{ local_llm_model_pull is defined and local_llm_model_pull.changed }}"
      model_refreshed: "{{ local_llm_refresh_model | bool and local_llm_model_pull is defined and local_llm_model_pull.changed }}"
      pi_installed: "{{ local_llm_pi_install is defined and local_llm_pi_install.changed }}"
      pi_updated: "{{ local_llm_pi_updated | default(false) }}"
      pi_update_changed: "{{ local_llm_pi_upgrade_result is defined and local_llm_pi_upgrade_result.changed }}"
      pi_config_changed: "{{ local_llm_pi_config.changed }}"

- name: Configure sbx access to host Ollama
  ansible.builtin.include_tasks: sbx.yml
