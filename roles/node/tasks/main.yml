---
- name: Locate Homebrew nvm
  ansible.builtin.command:
    argv: [brew, --prefix, nvm]
  register: node_nvm_prefix
  changed_when: false

- name: Create nvm directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.nvm"
    state: directory
    mode: '0755'

- name: Resolve current remote Node.js LTS
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm version-remote --lts
  environment: &nvm_environment
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"
    NVM_SCRIPT: "{{ node_nvm_prefix.stdout }}/nvm.sh"
  register: node_remote_node
  changed_when: false
  failed_when: node_remote_node.rc != 0 or node_remote_node.stdout is not regex('^v[0-9]+\.[0-9]+\.[0-9]+$')

- name: Check installed Node.js LTS version
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm version "$NODE_VERSION"
  environment:
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"
    NVM_SCRIPT: "{{ node_nvm_prefix.stdout }}/nvm.sh"
    NODE_VERSION: "{{ node_remote_node.stdout }}"
  register: node_installed_node
  changed_when: false
  failed_when: node_installed_node.rc not in [0, 3] or node_installed_node.stdout not in [node_remote_node.stdout, 'N/A']

- name: Install missing Node.js LTS version
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm install "$NODE_VERSION"
  environment:
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"
    NVM_SCRIPT: "{{ node_nvm_prefix.stdout }}/nvm.sh"
    NODE_VERSION: "{{ node_remote_node.stdout }}"
  when: node_installed_node.stdout == 'N/A'
  changed_when: true

- name: Check nvm default alias
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.nvm/alias/default"
  register: node_default_alias_stat

- name: Read nvm default alias
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.nvm/alias/default"
  register: node_default_alias
  when: node_default_alias_stat.stat.exists

- name: Point nvm default alias at LTS
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm alias default 'lts/*'
  environment: *nvm_environment
  when: not node_default_alias_stat.stat.exists or (node_default_alias.content | b64decode | trim) != 'lts/*'
  changed_when: true

- name: Resolve nvm-managed Node.js executable
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm which "$NODE_VERSION"
  environment:
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"
    NVM_SCRIPT: "{{ node_nvm_prefix.stdout }}/nvm.sh"
    NODE_VERSION: "{{ node_remote_node.stdout }}"
  register: node_executable
  changed_when: false
