---
- name: Locate Homebrew nvm
  ansible.builtin.command:
    argv:
      - brew
      - --prefix
      - nvm
  register: agent_skills_nvm_prefix
  changed_when: false

- name: Create nvm directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.nvm"
    state: directory
    mode: '0755'

- name: Install or refresh Node.js LTS with nvm
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm install --lts && nvm alias default 'lts/*'
  environment:
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"
    NVM_SCRIPT: "{{ agent_skills_nvm_prefix.stdout }}/nvm.sh"
  changed_when: true

- name: Resolve nvm-managed Node.js executable
  ansible.builtin.command:
    argv:
      - /bin/zsh
      - -c
      - source "$NVM_SCRIPT" && nvm which 'lts/*'
  environment:
    NVM_DIR: "{{ ansible_env.HOME }}/.nvm"
    NVM_SCRIPT: "{{ agent_skills_nvm_prefix.stdout }}/nvm.sh"
  register: agent_skills_node_executable
  changed_when: false

- name: List installed Flux plugins
  ansible.builtin.command:
    argv:
      - flux
      - plugin
      - list
  register: agent_skills_flux_plugins
  changed_when: false

- name: Install Flux schema plugin
  ansible.builtin.command:
    argv:
      - flux
      - plugin
      - install
      - schema
  when: agent_skills_flux_plugins.stdout is not regex('(?m)^schema\s')
  changed_when: true

- name: Update Flux schema plugin
  ansible.builtin.command:
    argv:
      - flux
      - plugin
      - update
      - schema
  when: agent_skills_flux_plugins.stdout is regex('(?m)^schema\s')
  changed_when: true

- name: Install or refresh configured Flux agent skills
  ansible.builtin.command:
    argv:
      - "{{ agent_skills_node_executable.stdout | dirname }}/npx"
      - --yes
      - skills
      - add
      - fluxcd/agent-skills
      - --skill
      - "{{ item }}"
      - --global
      - --agent
      - codex
      - --agent
      - cursor
      - --yes
      - --json
  environment:
    PATH: "{{ agent_skills_node_executable.stdout | dirname }}:{{ ansible_env.PATH }}"
  loop: "{{ flux_agent_skills }}"
  changed_when: true

- name: Install or refresh configured Matt Pocock agent skills
  ansible.builtin.command:
    argv:
      - "{{ agent_skills_node_executable.stdout | dirname }}/npx"
      - --yes
      - skills
      - add
      - mattpocock/skills
      - --skill
      - "{{ item }}"
      - --global
      - --agent
      - codex
      - --agent
      - cursor
      - --yes
      - --json
  environment:
    PATH: "{{ agent_skills_node_executable.stdout | dirname }}:{{ ansible_env.PATH }}"
  loop: "{{ matt_pocock_agent_skills }}"
  changed_when: true
