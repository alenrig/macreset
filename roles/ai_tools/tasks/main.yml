---
- name: Preflight AI tools prerequisites and declared sources
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/preflight.py"
  environment:
    AI_SKILLS_JSON: "{{ ai_skills | to_json }}"
    AI_HERDR_PLUGINS_JSON: "{{ ai_herdr_plugins | to_json }}"
  changed_when: false

- name: Restore declared Agent Skills
  ansible.builtin.import_tasks: skills.yml

- name: Keep Herdr integrations current
  ansible.builtin.import_tasks: integrations.yml

- name: Restore declared Herdr plugins
  ansible.builtin.import_tasks: plugins.yml
